title = "agent-config public repository policy"

[extend]
useDefault = true

[[rules]]
id = "authorization-bearer"
description = "Authorization Bearer value"
regex = '''(?i)authorization\s*[:=]\s*["']?bearer\s+[A-Za-z0-9._~+/=-]{20,}'''
keywords = ["authorization", "bearer"]

[[rules]]
id = "cookie-secret"
description = "Likely session cookie assignment"
regex = '''(?i)(cookie|session[_-]?token)\s*[:=]\s*["'][A-Za-z0-9%._~+/=-]{24,}["']'''
keywords = ["cookie", "session_token", "session-token"]

[[rules.allowlists]]
description = "Documentation placeholders"
regexTarget = "match"
regexes = ['''(?i)(example|placeholder|your[_-]|dummy|redacted|<[^>]+>)''']
