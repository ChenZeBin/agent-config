id: validation-handoff
title: 可运行界面的真实验收交接
description: 验证 Skill 不把构建成功当成视觉验收，并覆盖目标尺寸、键盘、状态和截图。

input:
  prompt: |
    一个 Typeless 风格 HTML 控制面板已经“构建成功”。请写最终交付前的最小验收清单，不要修改文件。要覆盖真实渲染环境、尺寸边界、无鼠标操作、交互状态、视觉证据，并说明机器检查对主观审美的证明边界。

expect:
  must_contain: ["浏览器", "截图"]

judge:
  type: rule_based
  success:
    - output_matches:
        all: ["真实浏览器|实际浏览器|目标浏览器|浏览器中", "尺寸|视口|viewport", "键盘|Tab", "focus-visible|焦点", "截图|截屏", "自动化|机器检查", "不能|无法", "审美|喜欢|偏好|舒服|主观|美感|观感"]
