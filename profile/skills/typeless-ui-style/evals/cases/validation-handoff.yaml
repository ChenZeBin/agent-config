{
  "id": "validation-handoff",
  "title": "可运行界面的真实验收交接",
  "description": "验证 Skill 不把构建成功当成视觉验收，并覆盖目标尺寸、键盘、状态和截图。",
  "input": {
    "prompt": "一个 Typeless 风格 HTML 控制面板已经“构建成功”。请写最终交付前的最小验收清单，不要修改文件。要覆盖真实渲染环境、尺寸边界、无鼠标操作、交互状态、视觉证据，并说明机器检查对主观审美的证明边界。"
  },
  "expect": {
    "must_contain": [
      "浏览器",
      "截图",
      "构建成功"
    ]
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-luna",
    "criteria": [
      "这是写给未来执行的验收清单，不要求本轮已执行。清单须明确要求在实际交付的目标浏览器打开并操作最终 HTML；还须明确写出构建成功、编辑器预览或静态截图不能替代真实运行验证。未勾选待办项不是失败，评分只核对清单是否提出这些动作。",
      "清单须要求覆盖主要尺寸及窄/短等边界尺寸；要求不使用鼠标即可完成核心任务的键盘路径、可见焦点，并检查核心交互状态。本项不要求验证鼠标操作路径，也不要求本轮已执行清单。",
      "清单须要求未来捕获真实目标环境截图并人工复核视觉、层级或裁切等细节，不把截图存在本身当成审美通过。待办项未勾选或本轮没有截图不构成失败，因为用户只要求写验收清单。",
      "区分机器或自动化检查能证明的事实与不能单独证明的主观审美、偏好或舒适感；不得把机器检查通过说成用户会喜欢。"
    ],
    "pass_threshold": 1.0
  }
}
