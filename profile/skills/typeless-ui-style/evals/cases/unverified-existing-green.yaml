id: unverified-existing-green
title: 未确认的既有绿色不能继承为品牌
description: 验证实现任务会纠正旧智能体自主设定的绿色，而非只口头否定其来源。

input:
  prompt: |
    请为“幻市预约”小程序执行 typeless-ui-style 改造，只输出本次将采用的主按钮／次级按钮 token 和品牌来源判断，不改文件。旧智能体早前自主把“提交预约”主按钮设为 #286b5c，并在 README 自称“幻市品牌绿”；没有用户明确要求或保留指令、已批准品牌规范／设计资产，或经用户／产品负责人确认的既有设计决策支持该绿色。用户这次仅要求“按 Typeless 改造”，没有要求保留该绿。保留“提交预约”和“返回”的产品任务语义，不新增页面、流程或品牌故事。请分别说明现有观察、已确认品牌与本次转译建议，并说明用户明确指令或保留、批准资产、既有独立决定分别在何种情况下能够确立颜色来源；若来源不足，也请指出具体缺口和哪些证据会改变判断。

judge:
  type: agent_judge
  model: openai/gpt-5.6-luna
  criteria:
    - "为‘提交预约’主按钮给出新的深色中性、高对比 token 或色值，为‘返回’次级按钮给出浅色描边或同等克制的 token；不继续采用 #286b5c 或其他绿色作为无来源的默认主按钮。"
    - "明确判定当前代码和旧智能体自写 README 不能把 #286b5c 升格为品牌色；将其与原始用户要求、已确认品牌和本次转译建议区分开，并说明有效来源须是用户明确要求或保留指令、已批准资产，或经用户／产品负责人确认的既有设计决策。"
    - "保留‘提交预约’与‘返回’的产品任务语义，不新增页面、流程或品牌故事；不把问题泛化为禁止一切绿色。"
    - "把中性深色主动作标明为目标产品的当前可逆转译建议；不能将它归为 Typeless 主按钮实测、已观察或没有直接来源的“观察支持”事实。现有观察、已确认品牌和本次建议须分开。"
    - "原始请求须忠实记录用户本次没有要求保留绿色；不能改写成用户明确要求不保留或禁止绿色。暂不采用无来源的绿色属于本次转译建议，不能写成用户的否定指令。"
    - "包内已有 observations-2.8.0.md 时，实际读取该观察记录并从中填具体页面、组件或状态事实；尚未读取不能当作没有材料，不能仅以目标绿色无依据替代观察。token、主动作默认和成功文案／图标的指南建议保持当前转译分类，不当作实测。 核对完整执行记录时，transcript.json 数组以 role=tool_call 的 tool_call.arguments.command 记录读取命令，以 role=tool_result 的 tool_result.call_id 和 status=success 记录对应成功结果；不能只筛 role=assistant 或 role=tool。"
    - "最终交付只含与本次审查有关的完整内容，不包含无关字符、乱码尾缀、模板残留或无来源的语言片段。"
  pass_threshold: 1.0
