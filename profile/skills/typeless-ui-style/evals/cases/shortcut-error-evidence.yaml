{
  "id": "shortcut-error-evidence",
  "title": "快捷键错误画面与机制边界",
  "description": "捕获到错误视觉状态不等于知道触发机制，也不能继续声称全部错误态未观察。",
  "input": {
    "prompt": "根据 Typeless 2.8.0 的补充观察，说明快捷键待录入与系统保留键错误两种状态，以及目标产品如何转译。区分真实观察和未知机制，不操作应用。"
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_matches": {
          "all": [
            "红色|错误色",
            "边框",
            "系统.*保留|保留.*系统",
            "未知|未.*验证|未.*确定",
            "行内|紧邻|就地",
            "强调色",
            "待录入|录入态"
          ]
        }
      }
    ]
  }
