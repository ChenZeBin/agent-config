{
  "id": "shortcut-error-evidence",
  "title": "快捷键错误画面与机制边界",
  "description": "捕获到错误视觉状态不等于知道触发机制，也不能继续声称全部错误态未观察。",
  "input": {
    "prompt": "根据 Typeless 2.8.0 的补充观察，说明快捷键待录入与系统保留键错误两种状态，以及目标产品如何转译。区分真实观察和未知机制，不操作应用。"
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_matches": {
          "all": [
            "红色|错误色",
            "边框",
            "系统.*保留|保留.*系统",
            "未知|未.*验证|未.*确定",
            "行内|紧邻|就地",
            "强调色",
            "待录入|录入态",
            "Escape|Esc",
            "关闭整层设置",
            "焦点.*设置入口",
            "(?:重开|重新打开|再次打开).*未绑定",
            "原(?:有)?语音快捷键.*(?:保留|保持不变)"
          ],
          "not": [
            "取消行为.{0,12}未验证",
            "取消行为.{0,12}未知",
            "自动保存、取消和回滚规则未知",
            "未确认输入后的自动保存、取消和回滚规则",
            "取消和回滚规则.{0,4}(?:未知|未确认)",
            "输入后的取消、回滚和自动保存规则",
            "输入后的自动保存与取消机制未确认",
            "(?m)^[ -]*(?:Typeless 的 )?Escape.{0,12}只取消.{0,12}录入"
          ]
        }
      }
    ]
  }
}
