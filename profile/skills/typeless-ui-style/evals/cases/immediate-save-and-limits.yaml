{
  "id": "immediate-save-and-limits",
  "title": "即时保存、数量限制与键盘证据边界",
  "input": {
    "prompt": "请使用 typeless-ui-style，仅阅读该 Skill 及其 references，不检索项目、不联网、不操作应用、不改文件。基于最新目标语言实测，核对这些说法：添加第三种语言必须点保存，Escape会撤销，三项上限是原生disabled按钮，Tab能聚焦删除就代表完整键盘通过。请纠正并给目标产品即时保存和草稿保存的不同验收方法，说明单项限制与恢复。不要操作应用。"
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_matches": {
          "all": [
            "立即|即时",
            "Escape|Esc",
            "重启",
            "草稿",
            "三|3",
            "单项|一种|一项",
            "AX|可访问",
            "静态文本|文本",
            "Tab",
            "激活",
            "恢复"
          ],
          "not": ["\\]\\(<[^>\\n]*\\)"]
        }
      }
    ]
  }
}
