{
  "id": "current-tested-matrix",
  "title": "最新补测范围",
  "input": {
    "prompt": "请依据 Skill 的2026-09-28补测，简列真实已测、尝试但未证实、仍未完成三类。必须覆盖真实暗色、开关off、更新加载、禁用、窄窗、快捷键错误触发和精确动效，不把前次未知项原封不动当最新结论。 窄窗必须报告已测尺寸与恢复结果，并区分早期通道失败和后续成功。"
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_matches": {
          "all": [
            "暗色",
            "加载",
            "off|关闭",
            "禁用|disabled",
            "窄窗",
            "noWindowsAvailable|通道|工具限制",
            "未.*验证|未.*完成|未证实",
            "快捷键",
            "精确|时长",
            "988",
            "685",
            "1080",
            "750",
            "恢复"
          ]
        }
      }
    ]
  }
}
