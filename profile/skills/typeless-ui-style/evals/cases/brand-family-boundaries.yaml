{
  "id": "brand-family-boundaries",
  "title": "原触发范围和跨 App 数据边界",
  "input": {
    "prompt": "先读 typeless-ui-style 的 references/mac-utility-brand-kit.md。普通 Mac 极简设计请求是否会因这次加入品牌资料就自动触发本 Skill？同一品牌的 App 是否可默认共享账号、剪贴板、订阅和诊断数据？BrandAssets 等模块是否已实现？引用历史截图能否作为新 App 测试证据？不要输出色值。 如果有人提议为快速演示而临时覆盖当前真实剪贴板，是否可行？明确给出处理边界。"
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-luna",
    "criteria": [
      "普通 Mac 极简设计不自动触发；保持 FinderRight UI 默认、其他产品须明确 Typeless 风格的原范围。",
      "同品牌不授权共享账号、订阅、剪贴板或诊断数据；跨 App 数据流须明确意图、授权与边界，不能替换用户真实剪贴板做测试。",
      "BrandAssets 等只属于模块划分提案，不能声称存在已实现的共享 Swift Package；历史截图不能作为新 App 的验收证据。"
    ],
    "pass_threshold": 1.0
  }
}
