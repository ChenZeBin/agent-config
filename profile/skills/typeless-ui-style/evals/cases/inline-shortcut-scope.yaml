{
  "id": "inline-shortcut-scope",
  "title": "行内快捷键与未知边界",
  "description": "覆盖本次实机观察带来的组件与证据边界。",
  "input": {
    "prompt": "这是材料内的短答评测。请使用 typeless-ui-style，仅阅读本 Skill 和它的 references；不联网、不检索项目或安装包、不操作应用、不改文件；用不超过8条（可含表格）回答。依据 Typeless 2.8.0 观察，为目标 macOS 工具写快捷键编辑与二级弹窗的交互规格，不改文件。区分已观察和目标应补测的行为，不把未实测行为说成来源事实。 请特别对照行内快捷键录入与翻译目标弹窗各自按 Escape 的实测结果，并给出目标工具的提交触发和生效反馈。"
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-luna",
    "criteria": [
      "明确把快捷键入口描述为行内、原位或就地录入，而非独立快捷键弹窗；区分 Typeless 已观察事实与目标产品的转译建议。",
      "目标规格同时覆盖录入、冲突或校验错误、取消退出、提交或保存、焦点与值恢复；提交与保存可采用同义表达，但不能完全省略确认新值的行为。",
      "正确保留 Escape 的实测差异：快捷键录入可关闭整层设置，而翻译目标二级弹窗返回设置并恢复焦点与原选项；不能概括成参考应用永远只取消最内层。",
      "在最终答复中以 Typeless／参考应用为主语，明确指出至少一项仍未知或未验证的来源机制，如系统保留键错误的触发条件、完整冲突处理、错误后的成功保存或完整焦点循环。必须引用答复中的具体句子；只列目标工具要补测的取消、焦点或回滚，不满足来源机制缺口。不得把未测行为或目标建议说成 Typeless 已实测事实。"
    ],
    "pass_threshold": 1.0
  }
}
