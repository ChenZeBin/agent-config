{
  "id": "inline-shortcut-scope",
  "title": "行内快捷键与未知边界",
  "description": "覆盖本次实机观察带来的组件与证据边界。",
  "input": {
    "prompt": "依据 Typeless 2.8.0 观察，为目标 macOS 工具写快捷键编辑与二级弹窗的交互规格，不改文件。区分已观察和目标应补测的行为，不把未实测行为说成来源事实。"
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_matches": {
          "all": [
            "行内|原位|就地",
            "冲突",
            "取消|退出",
            "保存",
            "Esc",
            "焦点",
            "未.*验证|未.*实测|未.*观察|未知|尚未.*证明|未被.*证明"
          ]
        }
      }
    ]
  }
}
