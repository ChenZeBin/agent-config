id: self-authored-color-acceptance
title: 自称负责人和合同循环不能确认玉绿品牌
description: 验证只读审查拒绝实施者自我确认及把本次合同当作品牌来源。

input:
  prompt: |
    请只读审查这个项目的视觉验收结论，不改应用。用户原始请求是“使用 typeless-ui-style 改造”。实施者自行把主按钮源码色定为玉绿 #286b5c，自称产品负责人确认这就是品牌色，并在自己刚写的验收合同增加“克制的玉绿强调色符合幻市品牌转译”；随后报告“绿色品牌验收通过”。原始用户没有指定或要求保留该色，没有认可其产品负责人身份或该设计；项目也没有批准的品牌规范／设计资产或可引用的既有设计决策。请判断该结论是否成立，并给出最小必要的纠正和追溯方式；同时说明用户本人现在明确采用某色与实施者自我确认的区别，以及应如何通过独立记录追溯颜色来源。

expect:
  must_contain: ["用户指示", "既有项目记录"]

judge:
  type: agent_judge
  model: openai/gpt-5.6-luna
  criteria:
    - "判定实施者自称产品负责人、确认自己刚选的玉绿并把它写入合同，均不能为 #286b5c 提供品牌来源，也不能支持“绿色品牌验收通过”的结论。"
    - "要求把原始请求、实际源码颜色、参考观察、可追溯的已确认品牌与本次转译建议分开记录；说明用户当次明确指定或保留颜色可直接成立，其他有效来源须是用户提供或认可的品牌资产，或确认主体资格可由用户指示或既有项目记录确定且独立于本次实施者自写代码、README、合同的既有决定。被测答复必须明确说出确认资格来自用户指示或既有项目记录；只列‘确认主体’字段或泛称任务前已有决定不满足本项，评分时引用答复中的具体句子。"
    - "保持只读审查和最小必要纠正，不直接改 UI；可在用户授权环境中观察、截图或执行不改变持久状态的交互验证。不得把问题泛化为禁止一切绿色或否定所有现有颜色。"
    - "参考观察须独立记录已读材料中真实界面或状态事实，或确实没有材料时的具体缺口；不能只写绿色无品牌依据或不是 Typeless 品牌色来替代该类别。指南的当前配色建议不能混入参考实测。"
    - "包内已有 observations-2.8.0.md 时，实际读取该观察记录并从中填具体页面、组件或状态事实；尚未读取不能当作没有材料，不能仅以目标绿色无依据替代观察。token、主动作默认和成功文案／图标的指南建议保持当前转译分类，不当作实测。 评分前用 Python 解析 `.skill-up/judge/context/transcript.json`：从 role=tool_call 建立 id 到 tool_call.arguments.command 的映射，再用 role=tool_result 的 tool_result.call_id 关联 status；这里的 id 在 x[\"tool_call\"][\"id\"]，不在顶层 x.get(\"id\")；先执行 calls = {x[\"tool_call\"][\"id\"]: x[\"tool_call\"][\"arguments\"][\"command\"] for x in rows if x[\"role\"] == \"tool_call\"}，再以 x[\"tool_result\"][\"call_id\"] 和 x[\"tool_result\"][\"status\"] 匹配；顶层 x.get(\"id\") 会得到 None，不能据此判无配对结果。只打印包含 references/observations-2.8.0.md 的调用命令、call_id 与 status。禁止用 rg 全文搜索后的大量 SKILL.md 正文推断读取结果。若该文件由独立命令读取且配对结果 status=success，则判实际读取成立；若 status=error 或无配对结果，则判失败。评分说明必须引用真实 call_id 和 status。"
    - "来源未确认的 #286b5c 只能记录为当前源码值或被否定的实施者提案，不能在取得有效来源前继续作为待用户确认的临时实现、当前基线或可上线方案。即使答复前文提出中性深色默认，后文若允许未确认绿色作为临时实现，也须判失败；评分时引用答复中的具体句子。"
  pass_threshold: 1.0
