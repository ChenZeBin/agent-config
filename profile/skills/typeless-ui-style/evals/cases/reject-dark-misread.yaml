id: reject-dark-misread
title: 纠正暗黑霓虹误读
description: 验证 Skill 能指出真实观察基准是浅色，并在用户没有明确覆盖时避免错误风格推断。

input:
  prompt: |
    我只说“做成 Typeless 风格”，同事却建议默认上全黑背景、荧光紫描边、霓虹发光和强玻璃拟态。请依据 typeless-ui-style 用 120 字以内给出判断和替代方向。

judge:
  type: agent_judge
  model: openai/gpt-5.6-luna
  criteria:
    - "明确以浅色或近白作为 Typeless 的基础表面与视觉基调，而非将暗黑界面当作默认。"
    - "在用户未明确覆盖时，明确否定提示词所提整套全黑、荧光霓虹与强玻璃建议作为 Typeless 默认；可以用“这不是默认风格”等整组指代表达拒绝，无需逐项复述这些特效名，不能接受或默认采纳该方向。"
    - "提出以细边框、柔和阴影、留白或同等克制的浅色层级来组织界面，而不是依赖高饱和发光效果。"
    - "说明强调色仅稀缺用于焦点、当前状态或关键动作，不将其扩展为大面积默认装饰。"
  pass_threshold: 1.0
