{
  "id": "non-trigger-other-brand",
  "title": "无关品牌请求不强行套用 Typeless",
  "description": "验证 Skill 面对未提及 Typeless 的独立品牌方向时遵守适用边界。",
  "input": {
    "prompt": "为一个热带潜水旅行落地页提出一句话视觉方向。品牌要求是海洋蓝、高饱和珊瑚色、阳光感和大幅水下摄影；保持消费品牌与沉浸式内容体验，不要做成桌面工具产品。"
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-luna",
    "criteria": [
      "视觉方向保留海洋蓝、鲜明饱和的珊瑚色、明亮阳光感和大幅或沉浸式水下摄影；允许自然同义表达，低饱和或删去任一核心品牌要素应判失败。",
      "输出服务于热带潜水旅行消费品牌和沉浸内容体验，没有强行套用 Typeless、近白设置页、桌面工具或软件控件风格。",
      "最终答复必须恰好是一句话视觉方向，只有一个非空段落；开头直接是视觉方向，句前句后不得有“状态：已完成”“无需用户行动”、标题、适用性说明或其他过程汇报。即使视觉方向本身只有一句，额外状态段落也必须判失败。评分时引用最终答复的全部非空行，不能只摘取视觉方向句。"
    ],
    "pass_threshold": 1.0
  },
  "expect": {
    "must_not_contain": [
      "状态：",
      "无需用户行动"
    ]
  }
}
