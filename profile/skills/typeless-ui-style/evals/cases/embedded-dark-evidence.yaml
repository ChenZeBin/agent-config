{
  "id": "embedded-dark-evidence",
  "title": "示意图不能证明暗色实测",
  "description": "覆盖本次实机观察带来的组件与证据边界。",
  "input": {
    "prompt": "翻译目标弹窗内有黑色浮条示意图。同事认为已经能证实 Typeless 2.8.0 的完整暗色主题和动效，还想精确照抄 CSS 数值。请依据 Skill 纠正，并给出后续验证方向，不操作应用。"
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-luna",
    "criteria": [
      "明确指出黑色浮条是功能示意图，不足以证明全应用完整暗色主题；不得把示意图当运行态暗色截图。",
      "指出静态示意图或单张截图不能证明完整动效或精确时长，需要真实时间轴、录屏或可靠连续帧等动态证据。",
      "拒绝仅依据图像精确照抄CSS数值，说明数值尚未测得、只是近似/建议或缺最终运行样式依据；不得把依赖默认值当全局实测参数。",
      "提供真实目标环境的后续验证方向，并区分局部已观察状态与仍未证实的完整主题/交互覆盖，不声称本轮已经操作验证。"
    ],
    "pass_threshold": 1.0
  }
}
