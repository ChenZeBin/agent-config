{
  "id": "motion-provenance",
  "title": "动效数值证据分级",
  "input": {
    "prompt": "这是材料内的短答评测。请使用 typeless-ui-style，仅阅读本 Skill 和它的 references；不联网、不检索项目或安装包、不操作应用、不改文件；用不超过8条（可含表格）回答。同事把 Typeless 的动效规格写成：所有弹窗实测进入225ms、退出195ms，所有控件统一300ms；依据是包里 MUI 默认表和一次点击截图。请用本 Skill 审查这份规格，列出已记录的语言候选行、拖动/删除辅助控件、编辑图标的局部时长与easing，并标明证据层级；最后给目标产品的动效验证方案。不要操作应用。"
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_matches": {
          "all": [
            "默认",
            "覆写|覆盖",
            "不能|不等于|未.*实测",
            "150\\s*ms",
            "0\\.15\\s*s",
            "200\\s*ms",
            "0\\.2\\s*s",
            "300\\s*ms",
            "0\\.3\\s*s",
            "ease-in-out",
            "减少动态|reduced.motion",
            "时间轴|录屏|连续帧",
            "工具.*(?:耗时|等待时间)|调用.*(?:时间|耗时)|请求.*(?:时间|耗时)"
          ]
        }
      }
    ]
  }
}
