{
  "id": "focus-color-semantics",
  "title": "焦点与数据颜色分槽",
  "description": "覆盖本次实机观察带来的组件与证据边界。",
  "input": {
    "prompt": "参考 Typeless 2.8.0，为一个已有绿色品牌的统计工具设计语言选择器和统计摘要。只给设计说明，不改代码。明确哪些是实测、哪些是建议；说明焦点是否必须蓝色、如何处理图表颜色、长名称和当前选项。"
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_matches": {
          "all": [
            "深色|中性",
            "类别色|数据色|图表.*色",
            "绿色|品牌",
            "勾选|勾|选中标记",
            "截断|省略|长名称",
            "观察|实测",
            "建议|转译"
          ]
        }
      }
    ]
  }
}
