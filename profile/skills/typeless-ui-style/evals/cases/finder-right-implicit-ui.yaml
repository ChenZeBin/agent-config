id: finder-right-implicit-ui
title: FinderRight UI 请求默认使用沉淀风格
description: 验证不显式点名参考品牌时，FinderRight 的 UI 任务仍沿用已沉淀的视觉语言，同时不影响非 UI 工作。

input:
  prompt: |
    这是一个无需读取仓库、不修改代码的短答。请用不超过 8 条，为 FinderRight 超级右键新增的“批量重命名规则”面板写精简视觉与交互规格。保留文件语义，并覆盖默认、规则校验失败、处理中、完成以及键盘操作状态。不要把它设计成通用设置页。

expect:
  must_contain: ["软灰", "强调色"]

constraints:
  timeout_seconds: 360
  max_turns: 4

judge:
  type: agent_judge
  model: openai/gpt-5.6-luna
  criteria:
    - "输出保留 FinderRight 的文件选择、文件名预览、重命名与结果处理语义，没有把任务面板改成通用设置页，也没有把产品改名为 Typeless。"
    - "视觉规格明确采用近白或浅色主表面，并明确说明软灰选中态；同时说明强调色只稀缺用于焦点、当前状态或关键动作。红色错误图标、普通灰色控件或文件被选中不能替代这两项要求。"
    - "规格覆盖默认、规则校验失败、处理中、完成和键盘操作状态，且焦点与无鼠标操作路径清楚。"
    - "校验失败反馈必须在相关控件附近持续可见并可恢复，例如保留输入、禁用提交或提供修正路径；仅使用短暂 toast 应判失败。"
    - "输出不声称已经修改代码，并遵守不超过 8 条的短答要求。"
  pass_threshold: 0.8
