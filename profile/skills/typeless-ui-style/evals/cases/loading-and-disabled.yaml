{
  "id": "loading-and-disabled",
  "title": "加载与禁用不可混同",
  "input": {
    "prompt": "参考Typeless给任务弹窗写交互规格：同事认为蓝条占一半就是50%，灰色开关是disabled，空白新词的提交按钮必然禁用。请用最新观察核对这些判断，再给等待、完成、取消和禁用的正确验收办法，不操作应用。"
  },
  "judge": {
    "type": "rule_based",
    "success": [
      {
        "output_matches": {
          "all": [
            "不定进度|不确定进度",
            "百分比|50%",
            "取消",
            "完成|结果",
            "off|关闭",
            "disabled|禁用",
            "空白|新词",
            "AX|可访问",
            "后台|中止|停止"
          ]
        }
      }
    ]
  }
}
