id: default-button-not-success-green
title: 无品牌色时主按钮与成功反馈均不默认绿色
description: 验证旧版自拟绿色不会被当成 Typeless 的按钮或成功状态规范。

input:
  prompt: |
    我在做一款尚无品牌色的 macOS 小工具设置页。请用 typeless-ui-style 给“保存设置”主按钮、次级“取消”按钮和保存成功反馈定颜色，并写出对应 token 或色值。旧版 Skill 曾出现绿色 #197451，但我在 Typeless 界面没看到绿色；团队想把它用作主按钮和成功反馈。请判断并说明依据。只给设计决定，不操作项目。

judge:
  type: agent_judge
  model: openai/gpt-5.6-luna
  criteria:
    - "没有品牌色时，保存设置主按钮使用深色或近黑的中性底色，不采用 #197451 或其他绿色作为默认底色。"
    - "指出 #197451 是旧版 Skill 的自拟样例而非 Typeless 实测颜色；成功反馈也不默认使用绿色，应给出中性文字、勾选图标或清楚的状态说明。"
    - "取消等次级按钮采用白色或浅色描边，而不是另一个醒目的实心强调色。"
    - "分别为保存设置的主动作、取消的次级动作与保存成功反馈给出具体 token 或色值及其角色；可使用‘主动作’等同义表达，不要求固定使用‘主按钮’或‘成功’字样。"
    - "若提出未来采用 #197451 的条件，用户当次明确指定或保留可直接成立；品牌资产须明确由用户提供或认可，任务前既有决定须独立可追溯，任何非用户确认主体（包括团队）的资格须明确来自用户指示或任务前既有项目记录。只写‘团队批准’‘批准资产’或‘可追溯决定’不足。若不提出未来条件，则不强制增加此说明。"
    - "如果答复把‘形成新的明确品牌决定’列为未来采用 #197451 的独立路径，必须在同一分支明确主体是用户当次指定或保留；团队自行形成新决定不能替代用户指示、用户认可资产或任务前由适格主体确认的独立既有决定。前文另处写过主体资格规则，不能自动补足结尾含混的未来条件。评分须检查结尾实际句子。"
  pass_threshold: 1.0
