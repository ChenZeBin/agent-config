schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .
    include: [SKILL.md, "references/**"]

engine:
  name: codex
  model:
    provider: openai
    name: gpt-5.6-luna

cases:
  files:
    - evals/cases/finder-right-transfer.yaml
    - evals/cases/finder-right-implicit-ui.yaml
    - evals/cases/preserve-target-brand.yaml
    - evals/cases/reject-dark-misread.yaml
    - evals/cases/validation-handoff.yaml
    - evals/cases/non-trigger-other-brand.yaml
    - evals/cases/focus-color-semantics.yaml
    - evals/cases/embedded-dark-evidence.yaml
    - evals/cases/inline-shortcut-scope.yaml
    - evals/cases/shortcut-error-evidence.yaml
    - evals/cases/default-button-not-success-green.yaml
    - evals/cases/green-brand-exception.yaml
    - evals/cases/blind-save-button-css.yaml
    - evals/cases/contrast-and-focus.yaml
    - evals/cases/unverified-existing-green.yaml
    - evals/cases/unbranded-miniapp-redesign.yaml
    - evals/cases/self-authored-color-acceptance.yaml
  defaults:
    timeout_seconds: 240
    max_turns: 5
    expect:
      exit_code: 0
  parallelism: 1
  retry_policy:
    max_retries: 0

benchmark:
  enabled: false

report:
  formats: [json, html]
  artifacts: [transcript]
