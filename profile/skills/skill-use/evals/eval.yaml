{
  "schema_version": "v1alpha1",
  "environment": {
    "type": "none"
  },
  "skills": [
    {
      "source": "local_path",
      "path": ".",
      "include": [
        "SKILL.md",
        "agents/openai.yaml"
      ]
    }
  ],
  "engine": {
    "name": "codex"
  },
  "cases": {
    "files": [
      "evals/cases/name-discovery.yaml",
      "evals/cases/load-only.yaml",
      "evals/cases/missing-skill.yaml",
      "evals/cases/missing-tool.yaml",
      "evals/cases/ambiguous-name.yaml",
      "evals/cases/quoted-name.yaml",
      "evals/cases/ambiguity-recovery.yaml",
      "evals/cases/scope-boundary.yaml"
    ],
    "parallelism": 3,
    "retry_policy": {
      "max_retries": 0
    }
  },
  "benchmark": {
    "enabled": false
  },
  "report": {
    "formats": [
      "json"
    ],
    "artifacts": [
      "transcript"
    ]
  }
}
