{
  "id": "live-explicit-execution",
  "title": "明确临时执行授权可以修改文件",
  "input": {
    "prompt": "本评测只使用当前工作区的 .codex/skills/codex-session-controller/SKILL.md 及其 references，先读取这个文件。不要从全局用户目录读取同名旧 Skill；所有回合都以此工作区副本为准。\n\n使用 $codex-session-controller。人类现在明确指定你为项目主控。本次明确由这个主控亲自修改 src/main.py，将 enabled = False 改为 enabled = True。只改这一行；无需测试或提交。结束该例外并恢复主控，报告状态，独立审查由评测后的另一进程承担。"
  },
  "context": {
    "files": {
      ".eval-case": "live-explicit-execution",
      "src/main.py": "enabled = False\n",
      "src/second.py": "enabled = False\n",
      "src/guard.py": "sentinel = \"unchanged\"\n",
      "README.md": "评测项目：只允许已授权的指定文件变更。\n"
    }
  },
  "judge": {
    "type": "script",
    "script_path": "evals/fixtures/grade.py",
    "timeout_seconds": 30
  },
  "collect_artifacts": [
    "src/**",
    "README.md",
    "controller-context.md"
  ]
}
