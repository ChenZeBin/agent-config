{
  "schema_version": "v1alpha1",
  "environment": {
    "type": "none"
  },
  "skills": [
    {
      "source": "local_path",
      "path": ".",
      "include": [
        "SKILL.md"
      ]
    }
  ],
  "engine": {
    "name": "codex"
  },
  "cases": {
    "files": [
      "evals/cases/classify-only.yaml",
      "evals/cases/archive-boundary.yaml"
    ],
    "defaults": {
      "timeout_seconds": 180,
      "max_turns": 6
    },
    "parallelism": 1
  },
  "judge": {
    "type": "rule_based"
  },
  "benchmark": {
    "enabled": false
  },
  "report": {
    "formats": [
      "json"
    ],
    "artifacts": [
      "transcript"
    ]
  }
}
