{
  "schema_version": "v1alpha1",
  "environment": {
    "type": "none"
  },
  "skills": [
    {
      "source": "local_path",
      "path": ".",
      "include": [
        "SKILL.md",
        "references/**",
        "scripts/**"
      ]
    }
  ],
  "engine": {
    "name": "codex"
  },
  "cases": {
    "files": [
      "evals/cases/readonly-routing.yaml",
      "evals/cases/zero-exit-error.yaml",
      "evals/cases/wrong-cli.yaml",
      "evals/cases/space-path.yaml",
      "evals/cases/audit-scope.yaml",
      "evals/cases/git-side-effects.yaml",
      "evals/cases/unimplemented.yaml",
      "evals/cases/bounded-search.yaml"
    ],
    "defaults": {
      "timeout_seconds": 300,
      "max_turns": 8,
      "expect": {
        "exit_code": 0
      }
    },
    "parallelism": 2,
    "retry_policy": {
      "max_retries": 0
    }
  },
  "benchmark": {
    "enabled": false
  },
  "report": {
    "formats": [
      "json",
      "html"
    ],
    "artifacts": [
      "transcript"
    ]
  }
}
