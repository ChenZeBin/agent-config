{
  "id": "clipboard",
  "title": "相似剪贴板内容的快速找回",
  "input": {
    "prompt": "为桌面剪贴板历史工具留存改进核心交互。当前搜索+左列表+右详情，短句两处重复；每天高频找回，有一万条记录，长文本命中常在后半段，多条网址仅参数不同。希望有辨识度且打断更少。给出具体推荐、关键正常与失败路径、视觉决定和验证办法。只讨论方案，不改代码；不要联网，未提供运行证据。"
  },
  "expect": {
    "exit_code": 0
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-sol",
    "criteria": [
      "以高频找回和返回原工作为主线；说明选择与复制的语义及成功/失败的后续焦点或去向，而非仅列功能。",
      "提供有理由的内容辨认与搜索命中上下文方案，处理相似项/长文本，不擅自改变实际复制的原文。",
      "辨识度落实到核心操作中的具体行为和至少一个有理由的视觉选择，不只靠玻璃卡片等装饰；不自动上传内容或抓取剪贴板链接。",
      "给出与场景相关的可观察任务、失败信号和未验证边界，不把设计建议说成已实现或用户已经喜欢。"
    ],
    "pass_threshold": 1
  }
}
