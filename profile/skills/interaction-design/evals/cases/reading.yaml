{
  "id": "reading",
  "title": "阅读探索与风格约束",
  "input": {
    "prompt": "为一个长文阅读与研究 App 改进体验。用户常从正文跳到参考文献，再对比第二篇文章，最后回到原段落；批评是看着漂亮但经常迷路。品牌规定暖白底和酒红强调色，想更有辨识度。有人建议改成全屏快捷卡片，用更短阅读时间作为唯一成功指标。请给交互和视觉方案，比较有实际差异的方向并推荐；不要写代码或联网。没有真人测试。"
  },
  "expect": {
    "exit_code": 0
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-sol",
    "criteria": [
      "保留阅读位置、来路和跨文比较/返回的连续性，具体说明进入分支及返回的行为，而非强推取用即关闭。",
      "比较实质不同的流程或信息组织并推荐，解释取舍；不以更短阅读时长作为唯一成功，提出理解/定位类观察。",
      "遵守暖白底和酒红约束，给出具体视觉层级以及嵌入阅读主线的辨识行为，不只换装饰或靠唯一隐藏手势。",
      "提供可以实际执行的原型对照验证并区分假设和用户观察，不声称已证明用户喜欢。"
    ],
    "pass_threshold": 1
  }
}
