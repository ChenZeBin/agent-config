{
  "id": "transfer",
  "title": "高后果提交的流畅与结果未知",
  "input": {
    "prompt": "一个移动转账 App 想更流畅、有记忆点。用户会向新收款人发起转账，当前有输入页和提交前核对页；提交后服务器有时超时，但可能已经执行。设计负责人想删核对页、点按钮立即成功庆祝、超时就显示重试。请评审并提出更好的交互，涵盖中途离开再回来。只做设计，不写代码不联网，不讨论法律或投资建议。"
  },
  "expect": {
    "exit_code": 0
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-sol",
    "criteria": [
      "针对新收款人和不可逆后果保留或提出等价有效的关键对象金额核对机制，解释为何不能以少点击代替正确与信心。",
      "区分已成功、明确失败和结果未知；不把点击/超时当成成功/确定失败，不诱导未知结果下直接重复转账。",
      "明确提交中、退出重返的状态展示与实际可用恢复，不虚构后端已经幂等或已完成转账可撤销。",
      "提出服务可信提交的具体体验或视觉辨识点与验证任务，并保持方案与实际证据的区分。"
    ],
    "pass_threshold": 1
  }
}
