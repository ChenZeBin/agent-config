{
  "id": "local",
  "title": "局部导出反馈保持范围",
  "input": {
    "prompt": "只改桌面 App 一个导出按钮的文案与反馈，不改导航和架构。对象是当前筛选出的37条记录，点击后写CSV可能需十秒，失败时原数据无损且允许重试。按钮现在叫确定，点击后没反应。给不超过350字的交互文案与状态建议，不修改任何文件、不联网。"
  },
  "expect": {
    "exit_code": 0
  },
  "judge": {
    "type": "agent_judge",
    "model": "openai/gpt-5.6-sol",
    "criteria": [
      "将导出对象/范围和动作清楚呈现，覆盖进行中、成功和失败后的实际下一步，而不是泛泛原则。",
      "不将开始写文件当成完成；等待时避免重复触发并保持可理解反馈，不虚构已支持取消等能力。",
      "严格保持局部文案与状态范围，不扩展导航、架构、全产品重设计或强制大篇验收表格；保持请求的简短长度。"
    ],
    "pass_threshold": 1
  }
}
