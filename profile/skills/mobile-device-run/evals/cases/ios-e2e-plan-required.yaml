  "input": {
    "prompt": "使用当前安装的 mobile-device-run Skill，读取当前平台参考文件。此例只评测离线判断和命令计划；不要实际执行构建、设备、网络或 IDE 操作，不创建或修改文件。场景中的设备与工具状态是本例全部已知证据。\n用户要求在 iOS 真机 EVAL-IOS-02 上执行登录成功、登录失败及恢复路径的端到端测试。设备已连接且工具链可用，但本次尚未构建，没有需求到用例计划，也没有独立 plan-review 结果。请给出当前允许的下一步；不要把已有单元测试当作端到端计划审查。\n只输出 JSON 对象：platform 为 ios 或 android；device_id；configuration；commands 为 argv 数组的列表，表示当前可执行检查或在前序成功后可执行的完整计划；build_verified、installed_new、run_verified、goal_complete 为基于已给事实的布尔值；blocked_on 为 null、device、build、evidence 或 plan_review；next_step 用一句话说明下一步。使用 Debug 配置。命令计划本身不算已执行证据。\n另输出 artifact_verification_required 布尔值；recovery_actions 为当前恢复/诊断动作编号列表，可从 connect_selected_device、recheck_selected_device、authorize_selected_host、repair_signing、build_current_debug、query_selected_process、observe_selected_foreground、create_requirement_cases、independent_plan_review、relaunch_now、switch_device、start_simulator、uninstall_app 中选择，可为空。diagnosis 为对象，仅在给出实际构建错误时包含 exit_code 与 error，错误原文不改写。e2e_execution_allowed 表示当前已具备前置审查条件可执行端到端测试，未给出前审证据不能假定为已通过。只读取当前平台参考文件，不读取另一平台文件。\nJSON 字段约定：platform 使用小写 ios 或 android；configuration 表示构建类型，填写 Debug，完整 Android variant 仍在实际构建任务中表达。blocked_on 仅表示当前缺失条件、已发生失败或本例要求核验却缺少的证据；只是尚未执行的正常构建、安装或启动步骤不是阻塞，条件齐备的完整计划填写 null。recovery_actions 包含需要的诊断和诊断后有条件执行的恢复动作，不代表立即执行全部恢复。"
  },
