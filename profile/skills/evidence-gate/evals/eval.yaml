schema_version: v1alpha1
environment:
  type: none
skills:
  - source: local_path
    path: .
    include: [SKILL.md, "references/**", "scripts/**", "vendor/**"]
engine:
  name: codex
cases:
  files:
    - evals/cases/missing-dock-evidence.yaml
    - evals/cases/status-question.yaml
    - evals/cases/pre-delivery-upload-error.yaml
    - evals/cases/continue-after-review-rejection.yaml
    - evals/cases/unwired-entrypoint.yaml
    - evals/cases/e2e-plan-before-run.yaml
    - evals/cases/e2e-stale-plan.yaml
  defaults:
    timeout_seconds: 180
    max_turns: 8
  parallelism: 1
  retry_policy:
    max_retries: 0
benchmark:
  enabled: false
report:
  formats: [json]
  artifacts: [transcript]
