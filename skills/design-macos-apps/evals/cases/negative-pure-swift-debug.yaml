id: negative-pure-swift-debug
title: 纯 Swift 并发故障不应升级为 UI 设计任务
description: |
  验证负向触发边界：没有 UI/交互决策时，应聚焦并发问题而不是启动完整 Mac 设计流程。

input:
  prompt: |
    下面这个后台 service 与 UI 无关，但并发请求时偶发 data race。请定位原因并给出最小修复与测试思路；
    不涉及界面、窗口、交互或视觉设计。

    ```swift
    final class TokenCache {
        private var values: [String: Data] = [:]

        func load(_ key: String, fetch: @escaping () async throws -> Data) async throws -> Data {
            if let cached = values[key] { return cached }
            let value = try await fetch()
            values[key] = value
            return value
        }
    }
    ```

    这是离线评测，不要联网；输出不超过 900 个中文字。

context:
  repo_fixture: evals/fixtures/offline
  files:
    ".eval-case": "negative-pure-swift-debug\n"

judge:
  type: script
  script_path: evals/fixtures/grade_case.py
  timeout_seconds: 30
